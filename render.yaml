# Blueprint do Render pro backend (apps/api) — ver CLAUDE.md, "Decisões já
# tomadas" (Vercel + Render, custo zero). Plano free: hiberna após ~15min de
# inatividade e leva até ~50s pra responder na primeira requisição depois
# disso (cold start) — limitação aceita, não bug, documentada na Seção 5 do
# artigo.
#
# Ambiente Node nativo (não Docker) — mais simples de mapear pro monorepo via
# rootDir, e o buildCommand abaixo cobre tudo que o Dockerfile já fazia
# manualmente em multi-stage.
services:
  - type: web
    name: vicina-api
    runtime: node
    plan: free
    rootDir: apps/api
    # migrate deploy, não migrate dev: aplica migrations já commitadas sem
    # gerar novas nem pedir confirmação interativa — migrate dev é só pra
    # desenvolvimento local (ver CLAUDE.md, "Comandos úteis").
    #
    # --include=dev: com NODE_ENV=production setado (ver envVars abaixo), o
    # npm por padrão pula as devDependencies — inclusive @nestjs/cli, que o
    # `nest build` (chamado por `npm run build`) precisa pra existir. A flag
    # força a instalação delas só durante o build; NODE_ENV=production
    # continua valendo no runtime (start:prod), sem afetar o pacote final.
    #
    # prisma db seed ao final: seguro rodar em todo deploy porque seed.ts usa
    # upsert em tudo (categorias e conta de gestor) — idempotente, não
    # duplica nem falha em execuções repetidas.
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build && npx prisma db seed
    startCommand: npm run start:prod
    envVars:
      # Segredos — nunca em texto plano no repositório (é público). Preenchidos
      # manualmente no painel do Render após a criação do serviço.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Credenciais da conta de gestor criada pelo seed (ver apps/api/src/prisma/seed.ts
      # e apps/api/.env.example) — preencher manualmente no painel com um email e
      # uma senha reais de produção. NUNCA usar aqui o valor padrão do
      # .env.example (gestor@vicina.local / gestorSenha123): esse par só serve
      # pra desenvolvimento local e é público neste repositório.
      - key: SEED_GESTOR_EMAIL
        sync: false
      - key: SEED_GESTOR_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
